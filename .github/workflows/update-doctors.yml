name: Arzt-Daten wöchentlich aktualisieren

on:
  push:
    branches: [main]
    paths:
      - 'scripts/update-doctors.mjs'
      - 'data/additional-doctor-candidates.json'
      - 'data/manual-doctor-additions.json'
      - 'data/manual-doctor-additions-round2.json'
      - '.github/workflows/update-doctors.yml'
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: weekly-doctor-update
  cancel-in-progress: true

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Verifizierte manuelle Ergänzungen einmischen
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const basePath = 'data/additional-doctor-candidates.json';
          const manualPaths = [
            'data/manual-doctor-additions.json',
            'data/manual-doctor-additions-round2.json'
          ];
          const base = JSON.parse(fs.readFileSync(basePath, 'utf8'));
          const manualDoctors = manualPaths.flatMap((file) => {
            const data = JSON.parse(fs.readFileSync(file, 'utf8'));
            return data.doctors || [];
          });
          const merged = {
            ...base,
            doctors: [...(base.doctors || []), ...manualDoctors]
          };
          fs.writeFileSync(basePath, JSON.stringify(merged, null, 2) + '\n');
          console.log(`Zusatzquellen: ${(base.doctors || []).length} automatisch + ${manualDoctors.length} manuell verifiziert.`);
          NODE

      - name: Aktuelle Arzt-Daten aus allen Quellen abrufen
        env:
          OVERPASS_URL: https://overpass.kumi.systems/api/interpreter
        run: node scripts/update-doctors.mjs

      - name: Temporäre Zusammenführung zurücksetzen
        run: git checkout -- data/additional-doctor-candidates.json

      - name: Datenänderung committen
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/doctors.json
          if [ -f data/additional-geocache.json ]; then
            git add data/additional-geocache.json
          fi
          if git diff --cached --quiet; then
            echo "Nichts zu committen."
          else
            git commit -m "Arzt-Daten automatisch aktualisieren"
            git push origin HEAD:main
          fi

  deploy-pages:
    needs: update-data
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Neueste Version auschecken
        uses: actions/checkout@v6
        with:
          ref: main

      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v5

      - name: Seite hochladen
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Karte veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
