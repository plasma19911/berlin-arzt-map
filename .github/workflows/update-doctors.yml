name: Arzt-Daten wöchentlich aktualisieren

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: weekly-doctor-update
  cancel-in-progress: false

jobs:
  update-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6

      - name: Laufzeit anzeigen
        run: node --version

      - name: Aktuelle Arzt-Daten abrufen
        run: node scripts/update-doctors.mjs

      - name: Datenänderung committen
        shell: bash
        run: |
          if git diff --quiet -- data/doctors.json; then
            echo "Keine Datenänderung außer Aktualisierungszeitstempel erkannt."
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/doctors.json
          if git diff --cached --quiet; then
            echo "Nichts zu committen."
          else
            git commit -m "Arzt-Daten automatisch aktualisieren"
            git push
          fi

      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v5

      - name: Aktualisierte Seite hochladen
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Aktualisierte Karte veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
